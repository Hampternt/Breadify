[package]
name = "breadify"
version = "1.3.0"
edition = "2024"
build = "build.rs"
authors = ["Jesper Løvland <jesperlovland@proton.me>"]
license = "MIT"
description = "Turns a daily bread-order export into printed A4 picking lists"
repository = "https://github.com/Hampternt/Breadify"
readme = "README.md"

[dependencies]
calamine = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
opener = "0.8.5"
printpdf = { version = "=0.12.6", default-features = false }
rfd = "0.17.2"
thiserror = "2.0.20"
ttf-parser = "0.25.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"

[dev-dependencies]
serde_json = "1.0.151"
ttf-parser = "0.25.1"

[profile.release]
# A desktop app people run for a few minutes a day: build it small and fast,
# and keep the panic message, because a picker reading it is the only
# diagnostic there will be.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
