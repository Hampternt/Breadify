document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

.css --bg-elevated */\n  --ink-850:#17141F;  /* game.css --surface */\n  --ink-800:#1C1926;\n  --ink-750:#221E2E;\n  --ink-700:#262232;  /* game.css --chip */\n  --ink-600:#322C42;\n  --ink-500:#443C58;\n  --ink-400:#5F5876;\n  --ink-300:#8D87A0;  /* game.css --text-faint */\n  --ink-200:#ADA6BE;\n  --ink-100:#CDC6DD;  /* game.css --text-dim */\n  --ink-050:#F2EEF8;  /* game.css --text */\n  --ink-000:#FFFFFF;\n\n  /* --- base: violet (brand accent) --- */\n  --violet-700:#4A3A78;\n  --violet-600:#6A53A8;\n  --violet-500:#8F6FD8;\n  --violet-400:#B48EF7; /* game.css --violet */\n  --violet-300:#CBB0FF;\n  --violet-200:#DED0FF;\n  --violet-100:#EFE8FF;\n\n  /* --- base: semantic hues --- */\n  --mint-400:#4FD6A8;\n  --mint-600:#1F7F63;\n  --amber-400:#FFB570; /* game.css --amber */\n  --amber-600:#A86A34;\n  --rose-400:#F7768E;  /* game.css --red */\n  --rose-600:#8F3346;\n  --azure-400:#7AA2F7;\n  --azure-600:#2F4C8F;\n\n  /* --- base: alphas --- */\n  --violet-a08:rgba(180,142,247,.08);\n  --violet-a14:rgba(180,142,247,.14);\n  --violet-a28:rgba(180,142,247,.28);\n  --violet-a45:rgba(180,142,247,.45);\n  --white-a04:rgba(242,238,248,.04);\n  --white-a07:rgba(242,238,248,.07);\n  --white-a12:rgba(242,238,248,.12);\n  --white-a20:rgba(242,238,248,.20);\n  --black-a40:rgba(7,6,11,.40);\n  --black-a70:rgba(7,6,11,.72);\n\n  /* --- semantic: surfaces --- */\n  --surface-void:var(--ink-1000);\n  --surface-page:var(--ink-950);\n  --surface-raised:var(--ink-900);\n  --surface-card:var(--ink-850);\n  --surface-inset:var(--ink-900);\n  --surface-chip:var(--ink-700);\n  --surface-overlay:var(--ink-850);\n  --surface-hover:var(--white-a04);\n  --surface-active:var(--white-a07);\n  --surface-selected:var(--violet-a14);\n  --scrim:var(--black-a70);\n\n  /* --- semantic: text --- */\n  --text-strong:var(--ink-050);\n  --text-body:var(--ink-100);\n  --text-muted:var(--ink-300);\n  --text-faint:var(--ink-400);\n  --text-accent:var(--violet-300);\n  --text-on-accent:#191624; /* game.css --ink */\n  --text-link:var(--violet-300);\n  --text-link-hover:var(--violet-200);\n\n  /* --- semantic: borders --- */\n  --border-subtle:var(--white-a07);\n  --border-default:var(--ink-700);\n  --border-strong:var(--ink-600);\n  --border-accent:var(--violet-a45);\n  --border-focus:var(--violet-400);\n\n  /* --- semantic: interactive --- */\n  --accent:var(--violet-400);\n  --accent-hover:var(--violet-300);\n  --accent-press:var(--violet-500);\n  --accent-tint:var(--violet-a14);\n  --accent-glow:var(--violet-a28);\n  --accent-warm:var(--amber-400); /* secondary highlight: streaks, live state */\n\n  /* --- semantic: status --- */\n  --status-success:var(--mint-400);\n  --status-success-dim:var(--mint-600);\n  --status-warning:var(--amber-400);\n  --status-warning-dim:var(--amber-600);\n  --status-danger:var(--rose-400);\n  --status-danger-dim:var(--rose-600);\n  --status-info:var(--azure-400);\n  --status-info-dim:var(--azure-600);\n\n  /* --- semantic: syntax / terminal accents --- */\n  --code-key:var(--violet-300);\n  --code-string:var(--mint-400);\n  --code-num:var(--amber-400);\n  --code-comment:var(--ink-400);\n}\n<\u002Fstyle>\n<style>:root{\n  /* Archivo (display) and Space Grotesk (UI/body) are the repo's own self-hosted faces. */\n  --font-display:\"Archivo\",\"Archivo Fallback\",system-ui,sans-serif;\n  --font-sans:\"Space Grotesk\",\"Space Grotesk Fallback\",system-ui,sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,monospace;\n\n  --text-11:11px;\n  --text-12:12px;\n  --text-13:13px;\n  --text-14:14px;\n  --text-15:15px;\n  --text-16:16px;\n  --text-18:18px;\n  --text-21:21px;\n  --text-26:26px;\n  --text-32:32px;\n  --text-40:40px;\n  --text-52:52px;\n  --text-68:68px;\n\n  --leading-tight:1.04;\n  --leading-snug:1.22;\n  --leading-normal:1.5;\n  --leading-loose:1.7;\n\n  --tracking-tight:-0.025em;\n  --tracking-snug:-0.01em;\n  --tracking-normal:0;\n  --tracking-wide:0.04em;\n  --tracking-caps:0.10em;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n  --weight-black:900;\n\n  /* composed roles — display is Archivo 800/900, UI and body are Space Grotesk */\n  --type-display:var(--weight-black) var(--text-68)/var(--leading-tight) var(--font-display);\n  --type-h1:800 var(--text-40)/var(--leading-snug) var(--font-display);\n  --type-h2:700 var(--text-26)/var(--leading-snug) var(--font-display);\n  --type-h3:600 var(--text-18)/var(--leading-snug) var(--font-display);\n  --type-body:var(--weight-regular) var(--text-15)/var(--leading-normal) var(--font-sans);\n  --type-body-sm:var(--weight-regular) var(--text-13)/var(--leading-normal) var(--font-sans);\n  --type-ui:var(--weight-medium) var(--text-14)/1.2 var(--font-sans);\n  --type-mono:var(--weight-regular) var(--text-13)/1.45 var(--font-mono);\n  --type-label:var(--weight-medium) var(--text-11)/1.2 var(--font-mono);\n}\n<\u002Fstyle>\n<style>:root{\n  --space-0:0px;\n  --space-1:2px;\n  --space-2:4px;\n  --space-3:6px;\n  --space-4:8px;\n  --space-5:12px;\n  --space-6:16px;\n  --space-7:20px;\n  --space-8:24px;\n  --space-9:32px;\n  --space-10:40px;\n  --space-11:48px;\n  --space-12:64px;\n  --space-13:80px;\n  --space-14:112px;\n  --space-15:160px;\n\n  /* layout */\n  --gutter:24px;\n  --page-max:1180px;\n  --prose-max:68ch;\n  --rail-width:236px;\n  --header-height:56px;\n  --control-height-sm:28px;\n  --control-height-md:34px;\n  --control-height-lg:42px;\n}\n<\u002Fstyle>\n<style>:root{\n  --radius-xs:3px;\n  --radius-sm:5px;\n  --radius-md:8px;\n  --radius-lg:12px;\n  --radius-xl:18px;\n  --radius-pill:999px;\n\n  --border-width:1px;\n  --border-width-thick:2px;\n\n  /* Elevation on dark is border + tint first, shadow second. */\n  --shadow-flat:none;\n  --shadow-1:0 1px 2px rgba(0,0,0,.5);\n  --shadow-2:0 4px 14px rgba(0,0,0,.45);\n  --shadow-3:0 18px 48px rgba(0,0,0,.6);\n  --shadow-inset-hairline:inset 0 1px 0 rgba(242,238,248,.05);\n  --focus-ring:0 0 0 2px var(--surface n/* ---------- HubCard (section tile on the index) ---------- */\n.hm-hub{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-7);background:var(--surface-card);border:var(--border-width) solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-body);cursor:pointer;transition:var(--transition-surface),box-shadow var(--dur-base) var(--ease-snap)}\n.hm-hub:hover{border-color:var(--border-accent);transform:translateY(-2px);box-shadow:var(--shadow-2)}\n.hm-hub:focus-visible{outline:none;box-shadow:var(--focus-ring)}\n.hm-hub__top{display:flex;align-items:center;gap:var(--space-4);color:var(--accent)}\n.hm-hub__title{font:var(--type-h3);color:var(--text-strong);white-space:nowrap}\n.hm-hub__desc{font:var(--type-body-sm);color:var(--text-muted)}\n.hm-hub__foot{display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-2);font:var(--type-label);color:var(--text-faint)}\n\n/* ---------- CalorieRing / MacroRail (fitness) ---------- */\n.hm-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}\n.hm-ring__val{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px}\n.hm-ring__num{font:800 var(--text-32)/1 var(--font-display);color:var(--text-strong);letter-spacing:var(--tracking-tight)}\n.hm-ring__sub{font:var(--type-label);color:var(--text-faint)}\n.hm-rail{display:flex;flex-direction:column;gap:var(--space-3)}\n.hm-rail__head{display:flex;align-items:baseline;gap:var(--space-4);font:var(--type-label);color:var(--text-faint)}\n.hm-rail__val{margin-left:auto;color:var(--text-body)}\n.hm-rail__track{height:6px;border-radius:var(--radius-pill);background:var(--white-a07);overflow:hidden}\n.hm-rail__fill{height:100%;border-radius:var(--radius-pill);background:var(--accent);transition:width var(--dur-slow) var(--ease-snap)}\n\n/* ---------- Utility surfaces used by kits ---------- */\n.hm-grid-bg{background-color:var(--surface-page);background-image:var(--texture-grid);background-size:var(--texture-grid-size)}\n.hm-eyebrow{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-faint)}\n.hm-rule{height:1px;background:var(--border-subtle)}\n\n/* Legacy → new mapping.\n   The live site has two dark layers today: \"Nocturne\" (the fitness tracker, scoped to\n   `body.fitness-dark` in static/style.css) and the drinking game's own palette\n   (drinkinggame/assets/game.css). The new system is built from the drinking game's\n   values; Nocturne is the one that needs migrating.\n\n   Drop this file into the old CSS while migrating: `--noc-*` keeps working but now\n   resolves to the new tokens, so a page converts by deleting rules, not rewriting them.\n\n   | Nocturne (old)      | value    | New token          |\n   | ------------------- | -------- | ------------------ |\n   | --noc-bg            | #161826  | --surface-page     |\n   | --noc-surface       | #232532  | --surface-card     |\n   | --noc-surface-2     | #1c1e2b  | --surface-inset    |\n   | --noc-text          | #e9e9ed  | --text-strong      |\n   | --noc-muted (55%)   | —        | --text-muted       |\n   | --noc-faint (45%)   | —        | --text-faint       |\n   | --noc-accent        | #9184d9  | --accent (#B48EF7) |\n   | --noc-accent-300    | #d2cefd  | --violet-200       |\n   | --noc-accent-400    | #b5abfc  | --violet-300       |\n   | --noc-accent-900    | #2b2741  | --violet-700       |\n   | --noc-n700/800/900  | greys    | --ink-400/600/700  |\n   | --noc-divider       | 16% text | --border-subtle    |\n   | --noc-radius-sm/md/lg | 4/8/14 | --radius-sm(5)/md(8)/lg(12) |\n   | --noc-shadow-card   | 1px ring | border + --shadow-flat |\n   | --noc-shadow-pop    | ring+18px| --shadow-3         |\n\n   Note the two deliberate breaks: Nocturne's accent shifts from the greyer #9184d9 to\n   the drinking game's brighter #B48EF7, and its 1px-ring \"shadow\" becomes a real\n   border. Radii move 4/8/14 → 5/8/12. */\nbody.fitness-dark,.legacy-nocturne{\n  --noc-bg:var(--surface-page);\n  --noc-surface:var(--surface-card);\n  --noc-surface-2:var(--surface-inset);\n  --noc-text:var(--text-strong);\n  --noc-accent:var(--accent);\n  --noc-accent-300:var(--violet-200);\n  --noc-accent-400:var(--violet-300);\n  --noc-accent-900:var(--violet-700);\n  --noc-n700:var(--ink-400);\n  --noc-n800:var(--ink-600);\n  --noc-n900:var(--ink-700);\n  --noc-divider:var(--border-subtle);\n  --noc-muted:var(--text-muted);\n  --noc-faint:var(--text-faint);\n  --noc-radius-sm:var(--radius-sm);\n  --noc-radius-md:var(--radius-md);\n  --noc-radius-lg:var(--radius-lg);\n  --noc-shadow-card:0 0 0 1px var(--border-default);\n  --noc-shadow-pop:var(--shadow-3);\n}\n\n<\u002Fstyle>\n<script src=\"a5e0be3b-2631-4161-82e8-425585fbe9f4\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #07060B; }\n  a { color: var(--text-link); text-decoration: none; }\n  a:hover { color: var(--text-link-hover); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh;padding:32px;box-sizing:border-box;background:#07060B;font-family:'Space Grotesk',sans-serif\">\n<div style=\"width:1280px;height:864px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface-page);border:1px solid var(--border-default);border-radius:10px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.6)\">\n\n  <div style=\"flex:none;height:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 8px 0 16px;background:rgba(14,12,20,.82);border-bottom:1px solid var(--border-subtle)\">\n    <div style=\"display:flex;align-items:center;gap:16px;min-width:0\">\n      <img src=\"cf542ee0-9391-4915-8457-05bcbe51f723\" alt=\"Matvare Expressen\" style=\"flex:none;display:block;height:20px;width:83px\">\n      <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">PSR-BREAD-2026-03-04-to-2026-03-04 (1).xlsx<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:4px;flex:none\">\n      <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" from=\"a5e0be3b-2631-4161-82e8-425585fbe9f4#/_ds_bundle.js\" variant=\"ghost\" size=\"sm\" shortcut=\"K\" hint-size=\"auto,28px\">Search<\u002Fx-import>\n      <div style=\"width:12px\"><\u002Fdiv>\n      <x-import component-from-global-scope=\"HampterDesignSystem_03c259.IconButton\" variant=\"ghost\" size=\"sm\" icon=\"minus\" aria-label=\"Minimise\" hint-size=\"28px,28px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"HampterDesignSystem_03c259.IconButton\" variant=\"ghost\" size=\"sm\" icon=\"square\" aria-label=\"Maximise\" hint-size=\"28px,28px\"><\u002Fx-import>\n      <x-import component-from-global-scope=\"HampterDesignSystem_03c259.IconButton\" variant=\"ghost\" size=\"sm\" icon=\"x\" aria-label=\"Close\" hint-size=\"28px,28px\"><\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--border-default);background:var(--surface-raised)\">\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <button type=\"button\" sc-camel-on-click=\"{{ s.go }}\" style=\"flex:1;display:flex;align-items:center;gap:12px;padding:14px 20px;background:{{ s.bg }};border:0;border-bottom:2px solid {{ s.rule }};cursor:pointer;text-align:left\" style-hover=\"background:var(--surface-hover)\">\n        <span style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;color:{{ s.numColor }}\">{{ s.num }}<\u002Fspan>\n        <span style=\"font:700 15px/1.1 Archivo,sans-serif;letter-spacing:-.02em;color:{{ s.color }}\">{{ s.label }}<\u002Fspan>\n        <span style=\"font:400 11px/1 'IBM Plex Mono',monospace;color:var(--text-faint);margin-left:auto;white-space:nowrap\">{{ s.note }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column\">\n\n    <sc-if value=\"{{ isOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0\">\n        <div style=\"display:flex;align-items:center;justify-content:center;padding:40px\">\n          <div style=\"width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border:1px dashed var(--border-strong);border-radius:12px;background:var(--surface-raised);background-image:linear-gradient(rgba(242,238,248,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(242,238,248,.045) 1px,transparent 1px);background-size:32px 32px\">\n            <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Icon\" name=\"file-spreadsheet\" size=\"32\" hint-size=\"32px,32px\"><\u002Fx-import>\n            <div style=\"font:800 26px/1.2 Archivo,sans-serif;letter-spacing:-.025em;color:var(--text-strong);text-align:center;white-space:nowrap\">Drop today's export here<\u002Fdiv>\n            <div style=\"font:400 13px/1.45 'IBM Plex Mono',monospace;color:var(--text-muted);text-align:center;max-width:52ch\">PSR-BREAD-&lt;from&gt;-to-&lt;to&gt;.xlsx — one sheet named <span style=\"color:var(--code-string)\">Data<\u002Fspan>, 14 headers plus one unlabelled column. The delivery date is read from the filename.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:4px\">\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" variant=\"primary\" size=\"md\" icon=\"folder-open\" sc-camel-on-click=\"{{ next }}\" hint-size=\"auto,34px\">Choose file<\u002Fx-import>\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.KbdGroup\" keys=\"{{ openKeys }}\" hint=\"or press\" hint-size=\"auto,24px\"><\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:1px solid var(--border-default);padding:24px 20px;display:flex;flex-direction:column;gap:14px;background:var(--surface-page)\">\n          <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Recent<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ recents }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;cursor:pointer;text-align:left\" style-hover=\"background:var(--surface-hover);border-color:var(--border-strong)\">\n                <span style=\"font:500 13px/1.3 'IBM Plex Mono',monospace;color:var(--text-body)\">{{ r.date }}<\u002Fspan>\n                <span style=\"font:400 11px/1.3 'IBM Plex Mono',monospace;color:var(--text-faint)\">{{ r.meta }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCheck }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;overflow-y:auto;padding:28px 32px;display:flex;flex-direction:column;gap:24px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">What was read<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:12px\">\n            <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"5\">\n              <div style=\"padding:16px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;display:flex;flex-direction:column;gap:6px\">\n                <div style=\"font:500 26px/1 'IBM Plex Mono',monospace;color:var(--text-strong)\">{{ st.value }}<\u002Fdiv>\n                <div style=\"font:400 11px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)\">{{ st.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Checks<\u002Fdiv>\n            <div style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:var(--text-muted)\">6 passed · 2 warnings · 2 notes<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:var(--surface-card);border:1px solid var(--border-subtle);border-left:2px solid {{ c.edge }};border-radius:8px\">\n                <div style=\"flex:none;width:104px;padding-top:1px\">\n                  <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Badge\" tone=\"{{ c.tone }}\" dot=\"{{ true }}\" hint-size=\"auto,20px\">{{ c.kind }}<\u002Fx-import>\n                <\u002Fdiv>\n                <div style=\"min-width:0;display:flex;flex-direction:column;gap:4px\">\n                  <div style=\"font:500 14px/1.35 'Space Grotesk',sans-serif;color:var(--text-strong)\">{{ c.title }}<\u002Fdiv>\n                  <div style=\"font:400 12.5px/1.45 'IBM Plex Mono',monospace;color:var(--text-muted)\">{{ c.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:8px\">\n            <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Icon\" name=\"check\" size=\"14\" hint-size=\"14px,14px\"><\u002Fx-import>\n            <div style=\"font:400 12.5px/1.4 'IBM Plex Mono',monospace;color:var(--text-muted)\">Sheet shape, required cells, column types, order consistency, product consistency, one route per address — all passed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isConfigure }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:304px 1fr 356px\">\n\n        <div style=\"border-right:1px solid var(--border-default);padding:24px 20px;display:flex;flex-direction:column;gap:20px;overflow-y:auto\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Always printed<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ lockedFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:5px\">\n                  <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Icon\" name=\"lock\" size=\"12\" hint-size=\"12px,12px\"><\u002Fx-import>\n                  <span style=\"font:400 12.5px/1 'IBM Plex Mono',monospace;color:var(--text-body);white-space:nowrap\">{{ f }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Optional columns<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ optionalFields }}\" as=\"f\" hint-placeholder-count=\"8\">\n                <div style=\"flex:0 0 auto\">\n                  <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Tag\" interactive=\"{{ true }}\" selected=\"{{ f.on }}\" data-key=\"{{ f.key }}\" sc-camel-on-click=\"{{ toggleField }}\" hint-size=\"auto,24px\">{{ f.label }}<\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding-top:4px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Never printed<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;font:400 12.5px/1.4 'IBM Plex Mono',monospace;color:var(--text-faint)\">\n              <span style=\"text-decoration:line-through\">Route ordering<\u002Fspan>\n              <span>the list order says it<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:24px 28px;display:flex;flex-direction:column;gap:22px;overflow-y:auto\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Page<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Select\" label=\"Paper\" options=\"{{ paperOptions }}\" hint-size=\"100%,60px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Select\" label=\"Language of labels\" options=\"{{ langOptions }}\" hint-size=\"100%,60px\"><\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Density<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ densities }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button type=\"button\" data-key=\"{{ d.key }}\" sc-camel-on-click=\"{{ setDensity }}\" style=\"flex:1;display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:{{ d.bg }};border:1px solid {{ d.border }};border-radius:5px;cursor:pointer;text-align:left\" style-hover=\"background:var(--surface-hover)\">\n                  <span style=\"font:700 14px/1.1 Archivo,sans-serif;letter-spacing:-.02em;color:{{ d.color }}\">{{ d.label }}<\u002Fspan>\n                  <span style=\"font:400 11.5px/1.3 'IBM Plex Mono',monospace;color:var(--text-faint)\">{{ d.note }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">No-substitutes marker<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ markers }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <button type=\"button\" data-key=\"{{ m.key }}\" sc-camel-on-click=\"{{ setMarker }}\" style=\"flex:1;display:flex;flex-direction:column;gap:10px;padding:12px;background:{{ m.bg }};border:1px solid {{ m.border }};border-radius:5px;cursor:pointer;text-align:left\" style-hover=\"background:var(--surface-hover)\">\n                  <span style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:{{ m.color }}\">{{ m.label }}<\u002Fspan>\n                  <span style=\"display:flex;align-items:center;justify-content:center;height:34px;background:#fff;border-radius:2px;font:800 11px/1 Archivo,sans-serif;color:#000\">{{ m.sample }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font:400 11.5px/1.45 'IBM Plex Mono',monospace;color:var(--text-faint)\">Survives a mono laser and a photocopy. Colour only reinforces it.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n              <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Crates<\u002Fdiv>\n              <div style=\"font:400 11.5px/1 'IBM Plex Mono',monospace;color:var(--text-muted)\">{{ smallCount }} of 35 marked small<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px\">\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Select\" options=\"{{ largeCrate }}\" aria-label=\"Large crate capacity\" hint-size=\"100%,34px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Select\" options=\"{{ smallCrate }}\" aria-label=\"Small crate capacity\" hint-size=\"100%,34px\"><\u002Fx-import>\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Select\" options=\"{{ smallCounts }}\" aria-label=\"Small bread per slot\" hint-size=\"100%,34px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;padding:12px;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:8px\">\n              <sc-for list=\"{{ breads }}\" as=\"b\" hint-placeholder-count=\"12\">\n                <div style=\"flex:0 0 auto;max-width:100%\">\n                  <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Tag\" interactive=\"{{ true }}\" selected=\"{{ b.small }}\" data-key=\"{{ b.name }}\" sc-camel-on-click=\"{{ toggleSmall }}\" hint-size=\"auto,24px\">{{ b.name }}<\u002Fx-import>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font:400 11.5px/1.45 'IBM Plex Mono',monospace;color:var(--text-faint)\">Selected types are small. The crate count printed beside each customer is the fewest crates that hold their bread — rectangles for large, squares for small.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:8px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Fixed rules<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px\">\n              <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:flex-start;gap:9px;font:400 12px/1.4 'IBM Plex Mono',monospace;color:var(--text-muted)\">\n                  <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Icon\" name=\"lock\" size=\"12\" hint-size=\"12px,12px\"><\u002Fx-import>\n                  <span>{{ r }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-left:1px solid var(--border-default);padding:24px 20px;display:flex;flex-direction:column;gap:14px;background:var(--surface-page);overflow-y:auto\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Sample block<\u002Fdiv>\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;color:var(--text-faint)\">route 14<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:3px;padding:16px 18px;color:#000;font-family:'Space Grotesk',sans-serif\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-top:1.5px solid #000;padding-top:9px\">\n              <div>\n                <div style=\"font:500 10px/1.2 'Space Grotesk',sans-serif;letter-spacing:.05em;color:#5a5a5a\">Customer 012<\u002Fdiv>\n                <div style=\"font:800 19px/1.05 Archivo,sans-serif;letter-spacing:-.02em;margin-top:2px;white-space:nowrap\">Department 11<\u002Fdiv>\n                <sc-if value=\"{{ showAddress }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font:400 9px/1.2 'IBM Plex Mono',monospace;color:#7a7a7a;margin-top:4px\">Street 12<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px\">\n                <div style=\"font:500 10px/1 'IBM Plex Mono',monospace;color:#3d3d3d;white-space:nowrap\">want substitute: true<\u002Fdiv>\n                <sc-if value=\"{{ showOrderId }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font:400 8px/1 'IBM Plex Mono',monospace;color:#a2a2a2;white-space:nowrap\">order 1000621870<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;margin-top:7px\">\n              <sc-for list=\"{{ sampleLines }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;align-items:baseline;gap:10px;padding:3px 0;border-bottom:.5px solid #E2E2E2\">\n                  <div style=\"width:22px;text-align:right;font:600 14px/1 'IBM Plex Mono',monospace;flex:none\">{{ l.qty }}<\u002Fdiv>\n                  <div style=\"flex:1;font:400 11px/1.25 'Space Grotesk',sans-serif\">{{ l.name }}<\u002Fdiv>\n                  <sc-if value=\"{{ showSupplier }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"font:400 8px/1 'IBM Plex Mono',monospace;color:#8a8a8a;white-space:nowrap;flex:none\">{{ l.sup }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 11.5px/1.5 'IBM Plex Mono',monospace;color:var(--text-faint)\">Shown at print size. The department is the crate label, so it takes the heading and the customer sits above it.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPrint }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:420px 1fr\">\n\n        <div style=\"border-right:1px solid var(--border-default);display:flex;flex-direction:column;min-height:0\">\n          <div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-default)\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Routes<\u002Fdiv>\n            <div style=\"font:400 11.5px/1 'IBM Plex Mono',monospace;color:var(--text-muted);white-space:nowrap\">{{ routeSummary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow-y:auto\">\n            <div style=\"display:grid;grid-template-columns:24px 1fr 56px 56px;gap:0 12px;align-items:center;padding:8px 20px;font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint);border-bottom:1px solid var(--border-subtle)\">\n              <div><\u002Fdiv><div>Route<\u002Fdiv><div style=\"text-align:right\">Lines<\u002Fdiv><div style=\"text-align:right\">Sheets<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ routes }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <button type=\"button\" data-key=\"{{ r.key }}\" sc-camel-on-click=\"{{ toggleRoute }}\" style=\"width:100%;display:grid;grid-template-columns:24px 1fr 56px 56px;gap:0 12px;align-items:center;padding:9px 20px;background:{{ r.bg }};border:0;border-bottom:1px solid var(--border-subtle);cursor:pointer;text-align:left\" style-hover=\"background:var(--surface-hover)\">\n                <span style=\"display:flex;align-items:center;justify-content:center;width:15px;height:15px;border:1px solid {{ r.boxBorder }};border-radius:3px;background:{{ r.boxBg }};font:600 10px/1 'IBM Plex Mono',monospace;color:#191624\">{{ r.tick }}<\u002Fspan>\n                <span style=\"font:500 14px/1 'IBM Plex Mono',monospace;color:{{ r.color }}\">{{ r.name }}<\u002Fspan>\n                <span style=\"text-align:right;font:400 12.5px/1 'IBM Plex Mono',monospace;color:var(--text-faint)\">{{ r.lines }}<\u002Fspan>\n                <span style=\"text-align:right;font:400 12.5px/1 'IBM Plex Mono',monospace;color:var(--text-muted)\">{{ r.sheets }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;min-height:0;background:var(--surface-void)\">\n          <div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border-default);background:var(--surface-page)\">\n            <div style=\"font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.10em;text-transform:uppercase;color:var(--text-faint)\">Preview<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" variant=\"ghost\" size=\"sm\" icon=\"chevron-left\" aria-label=\"Previous sheet\" hint-size=\"auto,28px\">Prev<\u002Fx-import>\n              <div style=\"font:400 12px/1 'IBM Plex Mono',monospace;color:var(--text-muted);min-width:96px;text-align:center\">sheet 1 of 24<\u002Fdiv>\n              <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" variant=\"ghost\" size=\"sm\" sc-camel-icon-right=\"chevron-right\" aria-label=\"Next sheet\" hint-size=\"auto,28px\">Next<\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow-y:auto;padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-content:start\">\n            <sc-for list=\"{{ sheets }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"aspect-ratio:210/297;background:#fff;border-radius:2px;padding:9px 8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 2px 10px rgba(0,0,0,.5);outline:{{ s.outline }};outline-offset:2px\">\n                  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:6px;border-bottom:1.5px solid #B48EF7;padding-bottom:3px\">\n                    <div style=\"font:900 13px/.85 Archivo,sans-serif;color:#000\">{{ s.route }}<\u002Fdiv>\n                    <div style=\"height:2px;width:34px;background:#c9c9c9\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ s.blocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;flex-direction:column;gap:2.5px;border-top:1px solid #000;padding-top:3px\">\n                      <div style=\"height:4px;width:{{ b.w }};background:#111\"><\u002Fdiv>\n                      <sc-for list=\"{{ b.rows }}\" as=\"w\" hint-placeholder-count=\"3\">\n                        <div style=\"display:flex;align-items:center;gap:3px\">\n                          <div style=\"height:2.5px;width:5px;background:#333\"><\u002Fdiv>\n                          <div style=\"height:2.5px;width:{{ w }};background:#bdbdbd\"><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:6px;font:400 11px/1 'IBM Plex Mono',monospace;color:var(--text-faint)\">\n                  <span style=\"color:var(--text-muted)\">{{ s.label }}<\u002Fspan>\n                  <span>{{ s.of }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--border-default);background:var(--surface-raised)\">\n    <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n      <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" variant=\"ghost\" size=\"md\" icon=\"arrow-left\" sc-camel-on-click=\"{{ back }}\" disabled=\"{{ atStart }}\" hint-size=\"auto,34px\">Back<\u002Fx-import>\n      <div style=\"font:400 12px/1.4 'IBM Plex Mono',monospace;color:var(--text-faint)\">{{ hint }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;flex:none\">\n      <sc-if value=\"{{ isPrint }}\" hint-placeholder-val=\"{{ false }}\">\n        <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Select\" options=\"{{ printers }}\" aria-label=\"Printer\" hint-size=\"240px,34px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" variant=\"secondary\" size=\"md\" icon=\"file-down\" hint-size=\"auto,34px\">Export PDF<\u002Fx-import>\n      <\u002Fsc-if>\n      <x-import component-from-global-scope=\"HampterDesignSystem_03c259.Button\" variant=\"primary\" size=\"md\" icon=\"{{ nextIcon }}\" sc-camel-on-click=\"{{ next }}\" hint-size=\"auto,34px\">{{ nextLabel }}<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1344,&quot;height&quot;:928}}\">\nconst STEPS = [\n  { num: '01', label: 'Open', note: 'xlsx' },\n  { num: '02', label: 'Check', note: '2 warnings' },\n  { num: '03', label: 'Configure', note: 'fields & layout' },\n  { num: '04', label: 'Print', note: '24 sheets' },\n];\n\nconst ROUTES = [\n  ['1', 24, 2], ['2', 13, 1], ['3', 30, 2], ['4', 22, 2], ['5', 34, 2], ['6', 29, 2],\n  ['7', 17, 1], ['8', 13, 1], ['9', 25, 2], ['10', 20, 1], ['11', 29, 2], ['12', 14, 1],\n  ['13', 26, 1], ['14', 32, 2], ['hau 1', 12, 1], ['hau 2', 12, 1],\n];\n\nconst OPTIONAL = [\n  ['totals', 'Route\\u00a0totals', true],\n  ['supplier', 'Supplier', true],\n  ['orderId', 'Order ID', true],\n  ['street', 'Street', false],\n  ['comment', 'Comment', false],\n  ['date', 'Date', false],\n  ['productId', 'Product ID', false],\n  ['sku', 'SKU', false],\n  ['position', 'Position', false],\n  ['region', 'Region', false],\n];\n\n// All 35 bread types in the export. `true` = counts as a small item, so more of\n// them fit a crate slot — the printed crate glyphs are derived from this list.\nconst BREADS = [\n  ['Bakehuset Grovbrød M/sirup 750g', false],\n  ['Bakehuset Grovbrød M/sirup Skåret 750g', false],\n  ['Barnehagebrødet - Oppskåret 750g', false],\n  ['Dansk Rugbrød Hel Sandnes Bakeri', false],\n  ['Emballerte Skoleboller 2 Pk Sandnes Bakeri', true],\n  ['Energi Stykke Sandnes Bakeri', true],\n  ['Fransk Landbrød Halvstekt Bakehuset 4 Stk', false],\n  ['Franskbrød U/valmuefrø Oppd Sandnes Bakeri', false],\n  ['Frokostbrød Fine 4pk Emball Sandnes Bakeri', true],\n  ['Frokostbrød Grove 4pk Emball Sandnes Bakeri', true],\n  ['Frokostbrød Grove Sandnes Bakeri', false],\n  ['Frokostbrød Sandnes Bakeri', false],\n  ['Frøhorn 1stk Bakehuset', true],\n  ['Funkygine Fiberbrød 700g Bakehuset Uskåret', false],\n  ['Gleding Barnehagebrød Sandnes Bakeri', false],\n  ['Grovbrød M/sirup Oppdelt Sandnes Bakeri', false],\n  ['Grovbrød Skåret 750g Bakehuset', false],\n  ['Hamburgerbrød 6pk Sandnes Bakeri Ikke Kuttet', true],\n  ['Havrebrød Oppdelt Sandnes Bakeri', false],\n  ['Holdbart Havrebrød Skåret 750g Bakehuset (har Vært Fryst)', false],\n  ['Horn Fint Sandnes Bakeri', true],\n  ['Horn Grovt Sandnes Bakeri', true],\n  ['Hveteboller 8stk Sandnes Bakeri', true],\n  ['Kneipp Holdbar Skåret 750g Bakehuset (har Vært Fryst)', false],\n  ['Kneippbrød Oppdelt, Sandnes Bakeri', false],\n  ['Loff Skåret 600g Bakehuset', false],\n  ['Norsk Fjellbrød Skåret 750g Bakehuset', false],\n  ['Ostebrød Sandnes Bakeri', true],\n  ['Pølsebrød 10pk Sandnes Bakeri -ikke Kuttet', true],\n  ['Ryfylkebrød Sandnes Oppdelt Bakeri', false],\n  ['Sandnesbrød Oppdelt Sandnes Bakeri', false],\n  ['Sekskornsbrød Oppdelt Sandnes Bakeri', false],\n  ['Skolebrød 140g Bakehuset', true],\n  ['Wienerbrød 95g Bakehuset', true],\n  ['Wienerbrød Sandnes Bakeri', true],\n];\n\nclass Component extends DCLogic {\n  state = {\n    small: BREADS.reduce((a, [n, s]) => ((a[n] = s), a), {}),\n    step: 0,\n    density: 'mid',\n    marker: 'badge',\n    fields: OPTIONAL.reduce((a, [k, , on]) => ((a[k] = on), a), {}),\n    dropped: ROUTES.reduce((a, [k]) => ((a[k] = true), a), {}),\n  };\n\n  go = (i) => this.setState({ step: Math.max(0, Math.min(3, i)) });\n\n  renderVals() {\n    const { step, density, marker, fields, dropped } = this.state;\n    const selected = ROUTES.filter(([k]) => dropped[k]);\n    const sheetTotal = selected.reduce((n, [, , s]) => n + s, 0);\n\n    return {\n      steps: STEPS.map((s, i) => ({\n        ...s,\n        go: () => this.go(i),\n        bg: i === step ? 'var(--surface-card)' : 'transparent',\n        rule: i === step ? 'var(--violet-400)' : 'transparent',\n        color: i === step ? 'var(--text-strong)' : 'var(--text-muted)',\n        numColor: i === step ? 'var(--violet-300)' : 'var(--text-faint)',\n      })),\n      isOpen: step === 0,\n      isCheck: step === 1,\n      isConfigure: step === 2,\n      isPrint: step === 3,\n      atStart: step === 0,\n      next: () => this.go(step + 1),\n      back: () => this.go(step - 1),\n      nextLabel: ['Read the file', 'Continue anyway', 'Preview sheets', 'Print ' + sheetTotal + ' sheets'][step],\n      nextIcon: ['file-search', 'arrow-right', 'arrow-right', 'printer'][step],\n      hint: [\n        'One sheet named Data. 35 MB or less.',\n        'Two warnings — nothing that stops a print.',\n        'Six fields always print; the rest are yours.',\n        'One route per sheet set. Orders at one address share a heading.',\n      ][step],\n      openKeys: ['Ctrl', 'O'],\n\n      recents: [\n        { date: '2026-03-04', meta: '352 rows · 148 orders · 16 routes' },\n        { date: '2026-03-03', meta: '341 rows · 143 orders · 16 routes' },\n        { date: '2026-03-02', meta: '298 rows · 131 orders · 15 routes' },\n        { date: '2026-02-28', meta: '377 rows · 155 orders · 16 routes' },\n      ],\n\n      stats: [\n        { value: '352', label: 'rows' },\n        { value: '148', label: 'orders' },\n        { value: '16', label: 'routes' },\n        { value: '35', label: 'products' },\n        { value: '03-04', label: 'date from filename' },\n      ],\n\n      checks: [\n        {\n          kind: 'warning', tone: 'warning', edge: 'var(--status-warning)',\n          title: 'Route ordering 1400 repeats on route 9',\n          detail: 'Street 64 and 19 — one stop, two entrances. Both print at that position, tiebroken by address.',\n        },\n        {\n          kind: 'warning', tone: 'warning', edge
